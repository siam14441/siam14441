<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48" role="img" aria-labelledby="t d">
  <title id="t">Essential Blocks</title>
  <desc id="d">Essential Blocks: test plan, regression and ship call. Links to essential-blocks.com.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD4C4"/>
      <stop offset="1" stop-color="#2c8fa0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { fill: #5FD4C4; font-size: 12px; font-weight: 700; letter-spacing: 3px; }
    .title { fill: #ffffff; font-size: 28px; font-weight: 800; }
    .sub { fill: #cfe3ea; font-size: 14px; }
    .cap { fill: #7f9aa5; font-size: 12px; }
    .name { fill: #5FD4C4; font-size: 16px; font-weight: 700; }
    .dom { fill: #9fb8c2; font-size: 12px; }
    .arrow { fill: #5FD4C4; font-size: 14px; font-weight: 700; }
    .pill { fill: #5FD4C4; fill-opacity: 0.08; stroke: #5FD4C4; stroke-opacity: 0.5; animation: sweep 7s ease-in-out infinite; }
    .pt { fill: #ffffff; font-size: 12px; font-weight: 600; }
    @keyframes sweep { 0% { fill-opacity: 0.08; stroke-opacity: 0.5; } 7% { fill-opacity: 0.5; stroke-opacity: 1; } 18% { fill-opacity: 0.08; stroke-opacity: 0.5; } 100% { fill-opacity: 0.08; stroke-opacity: 0.5; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .a { animation: rise 0.5s ease-out both; }
  </style>
  <rect width="860" height="48" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="47" rx="14" fill="none" stroke="#5FD4C4" stroke-opacity="0.35"/>
  <g class="a" style="animation-delay:0.15s"><circle cx="28" cy="24" r="4" fill="#5FD4C4"/><text x="44" y="29" class="mono name">Essential Blocks</text><text x="214" y="28" class="mono dom">essential-blocks.com</text><text x="362" y="29" class="mono arrow">↗</text><rect class="pill" x="456" y="12" width="120" height="24" rx="12" style="animation-delay:0.0s"/><text x="516" y="28" text-anchor="middle" class="mono pt">Test plan</text><rect class="pill" x="586" y="12" width="120" height="24" rx="12" style="animation-delay:0.9s"/><text x="646" y="28" text-anchor="middle" class="mono pt">Regression</text><rect class="pill" x="716" y="12" width="120" height="24" rx="12" style="animation-delay:1.8s"/><text x="776" y="28" text-anchor="middle" class="mono pt">Ship call</text></g>
</svg>

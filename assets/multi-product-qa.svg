<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-labelledby="t d">
  <title id="t">Multi-product QA</title>
  <desc id="d">Responsible QA for several products at once, not just one. Each product has its own release cycle, test plan and free and pro builds, shown as parallel pipelines at different stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD4C4"/>
      <stop offset="1" stop-color="#2c8fa0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { fill: #5FD4C4; font-size: 12px; font-weight: 700; letter-spacing: 3px; }
    .title { fill: #ffffff; font-size: 28px; font-weight: 800; }
    .sub { fill: #cfe3ea; font-size: 14px; }
    .lane { fill: #ffffff; fill-opacity: 0.04; stroke: #5FD4C4; stroke-opacity: 0.28; }
    .lbl { fill: #5FD4C4; font-size: 13px; font-weight: 700; }
    .done { fill: #5FD4C4; fill-opacity: 0.18; stroke: #5FD4C4; }
    .prog { fill: #5FD4C4; fill-opacity: 0.06; stroke: #5FD4C4; stroke-dasharray: 4 3; }
    .todo { fill: none; stroke: #7f9aa5; stroke-opacity: 0.55; }
    .pt-done { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .pt-prog { fill: #5FD4C4; font-size: 12px; font-weight: 600; }
    .pt-todo { fill: #7f9aa5; font-size: 12px; }
    .cap { fill: #7f9aa5; font-size: 12px; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 0.55; } 100% { opacity: 1; } }
    .a { animation: rise 0.5s ease-out both; }
    .pulse { animation: pulse 1.1s ease-in-out infinite alternate; }
  </style>

  <rect width="860" height="212" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="211" rx="16" fill="none" stroke="#5FD4C4" stroke-opacity="0.35"/>

  <!-- left block -->
  <g class="a" style="animation-delay:0.1s">
    <text x="36" y="58" class="sans eyebrow">SCOPE</text>
    <text x="36" y="96" class="sans title">Multi-product QA</text>
    <text x="36" y="124" class="sans sub">Responsible QA for several products</text>
    <text x="36" y="144" class="sans sub">at once, not just one.</text>
    <rect x="36" y="160" width="56" height="4" rx="2" fill="url(#accent)"/>
  </g>
  <rect x="316" y="28" width="1" height="156" fill="#5FD4C4" fill-opacity="0.25"/>

  <!-- lane A: all stages done -->
  <g class="a" style="animation-delay:0.3s">
    <rect class="lane" x="332" y="28" width="496" height="40" rx="10"/>
    <text x="350" y="53" class="mono lbl">Product A</text>
    <rect class="done" x="436" y="36" width="120" height="24" rx="12"/>
    <text x="496" y="52" text-anchor="middle" class="mono pt-done">✓ Test plan</text>
    <rect class="done" x="566" y="36" width="120" height="24" rx="12"/>
    <text x="626" y="52" text-anchor="middle" class="mono pt-done">✓ Regression</text>
    <rect class="done" x="696" y="36" width="120" height="24" rx="12"/>
    <text x="756" y="52" text-anchor="middle" class="mono pt-done">✓ Ship call</text>
  </g>

  <!-- lane B: last stage in progress -->
  <g class="a" style="animation-delay:0.6s">
    <rect class="lane" x="332" y="80" width="496" height="40" rx="10"/>
    <text x="350" y="105" class="mono lbl">Product B</text>
    <rect class="done" x="436" y="88" width="120" height="24" rx="12"/>
    <text x="496" y="104" text-anchor="middle" class="mono pt-done">✓ Test plan</text>
    <rect class="done" x="566" y="88" width="120" height="24" rx="12"/>
    <text x="626" y="104" text-anchor="middle" class="mono pt-done">✓ Regression</text>
    <g class="pulse">
      <rect class="prog" x="696" y="88" width="120" height="24" rx="12"/>
      <text x="756" y="104" text-anchor="middle" class="mono pt-prog">● Ship call</text>
    </g>
  </g>

  <!-- lane C: regression in progress -->
  <g class="a" style="animation-delay:0.9s">
    <rect class="lane" x="332" y="132" width="496" height="40" rx="10"/>
    <text x="350" y="157" class="mono lbl">Product C</text>
    <rect class="done" x="436" y="140" width="120" height="24" rx="12"/>
    <text x="496" y="156" text-anchor="middle" class="mono pt-done">✓ Test plan</text>
    <g class="pulse">
      <rect class="prog" x="566" y="140" width="120" height="24" rx="12"/>
      <text x="626" y="156" text-anchor="middle" class="mono pt-prog">● Regression</text>
    </g>
    <rect class="todo" x="696" y="140" width="120" height="24" rx="12"/>
    <text x="756" y="156" text-anchor="middle" class="mono pt-todo">○ Ship call</text>
  </g>

  <text x="332" y="198" class="mono cap">each with its own release cycle · test plan · free + pro builds</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="284" viewBox="0 0 860 284" role="img" aria-labelledby="t d">
  <title id="t">Multi-product QA</title>
  <desc id="d">Responsible QA for Essential Blocks, Templately, BetterLinks, NotificationX and SchedulePress at once. Each product runs its own pipeline of test plan, regression and ship call.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD4C4"/>
      <stop offset="1" stop-color="#2c8fa0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { fill: #5FD4C4; font-size: 12px; font-weight: 700; letter-spacing: 3px; }
    .title { fill: #ffffff; font-size: 28px; font-weight: 800; }
    .sub { fill: #cfe3ea; font-size: 14px; }
    .lane { fill: #ffffff; fill-opacity: 0.04; stroke: #5FD4C4; stroke-opacity: 0.28; }
    .lbl { fill: #5FD4C4; font-size: 13px; font-weight: 700; }
    .pill { fill: #5FD4C4; fill-opacity: 0.08; stroke: #5FD4C4; stroke-opacity: 0.5; animation: sweep 7s ease-in-out infinite; }
    .pt { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .cap { fill: #7f9aa5; font-size: 12px; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sweep { 0% { fill-opacity: 0.08; stroke-opacity: 0.5; } 7% { fill-opacity: 0.5; stroke-opacity: 1; } 18% { fill-opacity: 0.08; stroke-opacity: 0.5; } 100% { fill-opacity: 0.08; stroke-opacity: 0.5; } }
    .a { animation: rise 0.5s ease-out both; }
  </style>

  <rect width="860" height="284" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="283" rx="16" fill="none" stroke="#5FD4C4" stroke-opacity="0.35"/>

  <g class="a" style="animation-delay:0.1s">
    <text x="36" y="95" class="sans eyebrow">SCOPE</text>
    <text x="36" y="133" class="sans title">Multi-product QA</text>
    <text x="36" y="161" class="sans sub">Responsible QA for five products</text>
    <text x="36" y="181" class="sans sub">at once, not just one.</text>
    <rect x="36" y="197" width="56" height="4" rx="2" fill="url(#accent)"/>
  </g>
  <rect x="316" y="28" width="1" height="210" fill="#5FD4C4" fill-opacity="0.25"/>

  <g class="a" style="animation-delay:0.2s"><rect class="lane" x="332" y="28" width="496" height="34" rx="10"/><text x="348" y="50" class="mono lbl">Essential Blocks</text><rect class="pill" x="488" y="33" width="104" height="24" rx="12" style="animation-delay:0.0s"/><text x="540" y="49" text-anchor="middle" class="mono pt">Test plan</text><rect class="pill" x="600" y="33" width="104" height="24" rx="12" style="animation-delay:0.9s"/><text x="652" y="49" text-anchor="middle" class="mono pt">Regression</text><rect class="pill" x="712" y="33" width="104" height="24" rx="12" style="animation-delay:1.8s"/><text x="764" y="49" text-anchor="middle" class="mono pt">Ship call</text></g>
  <g class="a" style="animation-delay:0.35s"><rect class="lane" x="332" y="72" width="496" height="34" rx="10"/><text x="348" y="94" class="mono lbl">Templately</text><rect class="pill" x="488" y="77" width="104" height="24" rx="12" style="animation-delay:0.5s"/><text x="540" y="93" text-anchor="middle" class="mono pt">Test plan</text><rect class="pill" x="600" y="77" width="104" height="24" rx="12" style="animation-delay:1.4s"/><text x="652" y="93" text-anchor="middle" class="mono pt">Regression</text><rect class="pill" x="712" y="77" width="104" height="24" rx="12" style="animation-delay:2.3s"/><text x="764" y="93" text-anchor="middle" class="mono pt">Ship call</text></g>
  <g class="a" style="animation-delay:0.5s"><rect class="lane" x="332" y="116" width="496" height="34" rx="10"/><text x="348" y="138" class="mono lbl">BetterLinks</text><rect class="pill" x="488" y="121" width="104" height="24" rx="12" style="animation-delay:1.0s"/><text x="540" y="137" text-anchor="middle" class="mono pt">Test plan</text><rect class="pill" x="600" y="121" width="104" height="24" rx="12" style="animation-delay:1.9s"/><text x="652" y="137" text-anchor="middle" class="mono pt">Regression</text><rect class="pill" x="712" y="121" width="104" height="24" rx="12" style="animation-delay:2.8s"/><text x="764" y="137" text-anchor="middle" class="mono pt">Ship call</text></g>
  <g class="a" style="animation-delay:0.65s"><rect class="lane" x="332" y="160" width="496" height="34" rx="10"/><text x="348" y="182" class="mono lbl">NotificationX</text><rect class="pill" x="488" y="165" width="104" height="24" rx="12" style="animation-delay:1.5s"/><text x="540" y="181" text-anchor="middle" class="mono pt">Test plan</text><rect class="pill" x="600" y="165" width="104" height="24" rx="12" style="animation-delay:2.4s"/><text x="652" y="181" text-anchor="middle" class="mono pt">Regression</text><rect class="pill" x="712" y="165" width="104" height="24" rx="12" style="animation-delay:3.3s"/><text x="764" y="181" text-anchor="middle" class="mono pt">Ship call</text></g>
  <g class="a" style="animation-delay:0.8s"><rect class="lane" x="332" y="204" width="496" height="34" rx="10"/><text x="348" y="226" class="mono lbl">SchedulePress</text><rect class="pill" x="488" y="209" width="104" height="24" rx="12" style="animation-delay:2.0s"/><text x="540" y="225" text-anchor="middle" class="mono pt">Test plan</text><rect class="pill" x="600" y="209" width="104" height="24" rx="12" style="animation-delay:2.9s"/><text x="652" y="225" text-anchor="middle" class="mono pt">Regression</text><rect class="pill" x="712" y="209" width="104" height="24" rx="12" style="animation-delay:3.8s"/><text x="764" y="225" text-anchor="middle" class="mono pt">Ship call</text></g>

  <text x="332" y="264" class="mono cap">each with its own release cycle · test plan · free + pro builds</text>
</svg>
